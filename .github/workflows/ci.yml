name: Verificação do projeto

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    name: Verificar sintaxe JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar arquivos JavaScript
        run: |
          find backend frontend/js -type f -name "*.js" -print0 | xargs -0 -r -n1 node --check
