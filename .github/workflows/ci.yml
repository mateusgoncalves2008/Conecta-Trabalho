name: Verificação do projeto

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    name: Verificar código, testes e dependências
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v5
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Verificar sintaxe JavaScript
        run: npm run check
      - name: Executar testes automatizados
        run: npm test
      - name: Auditar dependências
        run: npm audit --audit-level=low
