name: Verificação do projeto

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    name: Verificar código, testes e dependências
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v5
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Instalar dependências e atualizar lockfile
        run: npm install
      - name: Verificar sintaxe JavaScript
        run: npm run check
      - name: Executar testes automatizados
        run: npm test
      - name: Gerar relatório da auditoria de dependências
        run: npm audit --json > npm-audit.json || true
      - name: Bloquear dependências com vulnerabilidades conhecidas
        run: npm audit --audit-level=low
      - name: Exportar lockfile para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lockfile-auditoria
          path: |
            package-lock.json
            npm-audit.json
          if-no-files-found: ignore
