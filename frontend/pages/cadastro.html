<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastrar | ConectaTrabalho</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="../css/cadastro.css">
  <script src="../js/main.js" defer></script>
  <script src="../js/cadastro.js" defer></script>
</head>
<body class="auth-page">
  <a class="back-link" href="../">← Voltar ao início</a>

  <main class="auth-layout">
    <section class="auth-intro">
      <a class="brand brand-auth" href="../">
        <span class="brand-mark">CT</span>
        <span>Conecta<span class="brand-light">Trabalho</span></span>
      </a>
      <span class="eyebrow">FAÇA PARTE</span>
      <h1>Conecte seu próximo passo ao lugar certo.</h1>
      <p>Crie sua conta para encontrar vagas ou divulgar oportunidades.</p>
    </section>

    <section class="auth-card">
      <h2>Criar conta</h2>
      <p class="form-subtitle">Preencha os dados para começar.</p>

      <form id="register-form" novalidate>
        <label class="field">
          Quero me cadastrar como
          <select name="tipo" id="account-type" required>
            <option value="candidato">Candidato</option>
            <option value="empresa">Empresa</option>
          </select>
        </label>

        <label class="field">
          Nome completo
          <input name="nome" type="text" required minlength="3" maxlength="120" autocomplete="name" placeholder="Seu nome">
        </label>

        <label class="field hidden" id="company-field">
          Nome da empresa
          <input name="nomeEmpresa" type="text" maxlength="160" placeholder="Nome da empresa">
        </label>

        <label class="field">
          E-mail
          <input name="email" type="email" required maxlength="160" autocomplete="email" placeholder="voce@exemplo.com">
        </label>

        <label class="field">
          Telefone (opcional)
          <input name="telefone" type="tel" maxlength="30" autocomplete="tel" placeholder="(33) 99999-9999">
        </label>

        <label class="field">
          Cidade
          <input name="cidade" type="text" required maxlength="100" value="Capelinha">
        </label>

        <label class="field">
          Senha
          <input name="senha" type="password" required minlength="8" maxlength="72" autocomplete="new-password" placeholder="Mínimo de 8 caracteres">
        </label>

        <label class="field">
          Confirmar senha
          <input name="confirmarSenha" type="password" required minlength="8" maxlength="72" autocomplete="new-password" placeholder="Digite a senha novamente">
        </label>

        <button class="button button-primary button-full" type="submit">Criar conta</button>
        <p class="form-feedback" id="form-feedback" aria-live="polite"></p>
      </form>

      <p class="auth-switch">Já tem uma conta? <a href="login.html">Entrar</a></p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
