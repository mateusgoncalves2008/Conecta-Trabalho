[build]
  command = "mkdir -p dist && cp index.html dist/ && cp -R frontend dist/frontend"
  publish = "dist"

# Mantém a API no mesmo domínio do site, preservando o fluxo de sessão.
[[redirects]]
  from = "/api/*"
  to = "https://conecta-trabalho.onrender.com/api/:splat"
  status = 200
  force = true

# Mantém os caminhos públicos já usados pelo frontend.
[[redirects]]
  from = "/img/*"
  to = "/frontend/img/:splat"
  status = 200

[[redirects]]
  from = "/css/*"
  to = "/frontend/css/:splat"
  status = 200

[[redirects]]
  from = "/js/*"
  to = "/frontend/js/:splat"
  status = 200

[[redirects]]
  from = "/pages/*"
  to = "/frontend/pages/:splat"
  status = 200

# Cabeçalhos de segurança aplicados ao frontend estático.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com data:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
